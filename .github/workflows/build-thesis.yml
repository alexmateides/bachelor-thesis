# .github/workflows/build-and-deploy.yml
name: Build & Deploy thesis + Site

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build_latex:
    runs-on: ubuntu-latest
    steps:
      # 1. Set up git repository
      - name: Set up Git repository
        uses: actions/checkout@v4
      - name: Create output dir
        run: mkdir -p output/articles

      # 2. Compile the thesis
      - name: Compile LaTeX document
        uses: xu-cheng/latex-action@v3
        with:
          root_file: ctufit-thesis.tex
          working_directory: src/thesis
          latexmk_use_lualatex: true
          args: -interaction=nonstopmode -halt-on-error
      - name: Upload PDF file
        uses: actions/upload-artifact@v4
        with:
          name: PDF
          path: src/thesis/ctufit-thesis.pdf

      # 3. Compile the A&A article (pdflatex, as the aa class expects)
      - name: Compile A&A article
        uses: xu-cheng/latex-action@v3
        with:
          root_file: aanda.tex
          working_directory: articles/aanda
          args: -pdf -interaction=nonstopmode -halt-on-error
      - name: Upload article PDF
        uses: actions/upload-artifact@v4
        with:
          name: ArticlePDF
          path: articles/aanda/aanda.pdf

      # 4. Copy the site index and both PDFs into the output dir
      - name: Copy index.html
        run: |
          if [ -f index.html ]; then
            cp index.html output/index.html
          else
            echo "Warning: index.html not found in repo root"
          fi

      - name: Copy thesis.pdf
        run: |
          if [ -f src/thesis/ctufit-thesis.pdf ]; then
            cp src/thesis/ctufit-thesis.pdf output/thesis.pdf
          else
            echo "Warning: src/thesis/ctufit-thesis.pdf not found"
          fi

      - name: Copy articles/aanda.pdf
        run: |
          if [ -f articles/aanda/aanda.pdf ]; then
            cp articles/aanda/aanda.pdf output/articles/aanda.pdf
          else
            echo "Warning: articles/aanda/aanda.pdf not found"
          fi

      # 5. Add your custom domain (CNAME)
      - name: Create CNAME
        run: echo "bachelor-thesis.mateides.com" > output/CNAME

      # 6. Deploy everything in output/ (index.html, thesis.pdf, articles/, CNAME) to gh-pages
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: output
          publish_branch: gh-pages